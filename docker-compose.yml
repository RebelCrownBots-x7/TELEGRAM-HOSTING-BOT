# REBEL CROWN Bot Hosting — local / VPS with Docker
# Usage:
#   1. cp .env.example .env   &&  edit BOT_TOKEN + ADMIN_IDS
#   2. docker compose up -d
#   3. docker compose logs -f

services:
  hosting:
    build: .
    container_name: rebel-crown-hosting
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=8080
      - HEALTH_SERVER=1
      - PYTHONUNBUFFERED=1
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      # Persist everything important across restarts / rebuilds
      - ./data:/app/data
      - ./storage:/app/storage
      - ./runtime:/app/runtime
      - ./logs:/app/logs
    # Optional: limit resources on shared VPS
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "1.0"
    #       memory: 512M
